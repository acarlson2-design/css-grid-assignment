<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
        }

       

            #wrapper {       
                display: grid;
                grid-template-columns: 1fr;
                grid-template-areas: 
                    "header"
                    "nav"
                    "main"
                    "aside"
                    "footer"
                ;
                gap: 10px;
                height: 100vh;
                
            }
        
    

        header {
            grid-area: header;
            background-color: blueviolet;
            border-radius: 20px;

        }

        nav {
            grid-area: nav;
            background-color: aqua;
            border-radius: 20px;
            height: 50px;
        
        }

        main {
            grid-area: main;
            background-color: green;
            border-radius: 20px;

        }

        aside {
            grid-area: aside;
            background-color: pink;
            border-radius: 20px;

        }

        footer {
            grid-area: footer;
            background-color: antiquewhite;
            border-radius: 20px;

        }

        @media (min-width: 768px) {
            #wrapper {      
                grid-template-columns: 2fr 1fr;
                grid-template-areas: 
                    "header header"
                    "nav nav"
                    "main aside"
                    "footer footer"
                ;
                
                gap: 20px;
            }
        
    
    }
         @media (min-width: 1200px) {
            #wrapper {
                grid-template-columns: 1fr 2fr 1fr;
                grid-template-areas: 
                    "header header header"
 
                    "nav main aside"
                    "footer footer footer"
                ;
                
                gap: 10px;
                max-width: 1200px;
                height: 100vh;
                margin: 0 auto;
            
        
            }

        }
        
    </style>
</head>
<body>
    <div id="wrapper">
  <header></header>
  <nav>...</nav>
  <main>...</main>
  <aside>...</aside>
  <footer>...</footer>
</div>
</body>
</html>
