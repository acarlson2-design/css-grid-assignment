<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
        }

       

            #wrapper {       
                display: grid;
                grid-template-columns: 1fr;
                grid-template-areas: 
                    "header"
                    "nav"
                    "main"
                    "aside"
                    "footer"
                ;
                gap: 10px;
                height: 100vh;
                
            }
        
    

        header {
            grid-area: header;
            background-color: pink;
            height: 160px;
            position: sticky; top: 0;
            border: solid

        }

        h1 {
            font-size: 40px;
            text-align: center;
            padding-top: 30px;
        

        }

        nav {
            grid-area: nav;
            background-color:white;
            border-radius: 20px;
            height: 100px;
            color: black;
            
        
        }

        .navmenu {
            list-style-type: none;
            display: flex;
            flex-direction: row;
            justify-content: center;
            
        }

        .navmenu li {
            
            padding: 20px;
        }

        .navmenu a {

            padding-right: 20px; 
            text-decoration: none; 
            color: black;
            font-weight: bold;
            
        }

        

        main {
            grid-area: main;
            background-color: white;
            border-radius: 20px;

        }

        aside {
            grid-area: aside;
            background-color: pink;
            border-radius: 20px;
         

        }

        footer {
            grid-area: footer;
            background-color: antiquewhite;
            border-radius: 20px;
            height: 50px;

        }

        @media (min-width: 768px) {
            #wrapper {      
                grid-template-columns: 2fr 1fr;
                grid-template-areas: 
                    "header header"
                    "nav nav"
                    "main aside"
                    "footer footer"
                ;
                
                gap: 20px;
            }
        
    
    }
         @media (min-width: 1200px) {
            #wrapper {
                grid-template-columns: 1fr 2fr 1fr;
                grid-template-areas: 
                    "header header header"
 
                    "nav main aside"
                    "footer footer footer"
                ;
                
                gap: 10px;
                max-width: 1200px;
                height: 100vh;
                margin: 0 auto;
            
        
            }

        }

    .card-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(250px, 1fr));
        gap: 1.5rem;
    }

    .card {
        background-color: antiquewhite;
        border: 3px solid pink;
        border-radius: 8px;
       padding: 1.5rem;
       box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .card .featured {
        grid-column: span 2;
        background-color:cadetblue;
        border-color: black;
    }
    @media (max-width: 850px) {
  .card-grid {
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  }

  .card.featured {
  
    grid-column: span 1;
  }
}
        
    </style>
</head>
<body>
    <div id="wrapper">
  <header>
    <h1>Aspen Rentals</h1>
  </header>
  <nav>
    <ul class="navmenu">
        <li><a href="home">Home</a></li>
        <li><a href="about">About</a></li>
        <li><a href="rentals">Rentals</a></li>
        <li><a href="contact">Contact</a></li>
    </ul>
  </nav>
  <main class="card-grid">
    <article class="card featured">
        <h2>Card 1</h2>
        <p>card info</p>
      </article>

      <article class="card">
        <h2>Card 2</h2>
        <p>card info.</p>
      </article>

      <article class="card">
        <h2>Card 3</h2>
        <p>card info</p>
      </article>

       <article class="card">
        <h2>Card 4</h2>
        <p>card info</p>
      </article>

       <article class="card">
        <h2>Card 5</h2>
        <p>card info</p>
      </article>

       <article class="card">
        <h2>Card 6</h2>
        <p>card info</p>
      </article>




    </main>
   

    
    

  </main>
  <aside>Aside info</aside>
  <footer>The Footer</footer>
</div>
</body>
</html>
